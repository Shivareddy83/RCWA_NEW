# Used only by the release pipeline's ephemeral staging job (runs inside the
# CI job itself, not on a dedicated staging server). Deliberately standalone
# rather than a merge-override of docker-compose.yml: it runs the exact
# pre-built, pre-scanned GHCR images passed via RCAA_BACKEND_IMAGE /
# RCAA_FRONTEND_IMAGE, so staging validates the same bytes that get promoted
# to production instead of a fresh local rebuild. No Caddy/TLS — the runner
# talks to the containers over plain localhost ports.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB must be set}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER must be set}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [rcaa-staging]

  backend:
    image: ${RCAA_BACKEND_IMAGE:?RCAA_BACKEND_IMAGE must be set}
    environment:
      APP_ENV: staging
      RUN_MIGRATIONS: "1"
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_BOOTSTRAP_TOKEN: ${AUTH_BOOTSTRAP_TOKEN:?AUTH_BOOTSTRAP_TOKEN must be set}
      CORS_ORIGINS: http://localhost:3000
      TRUST_PROXY_HEADERS: "0"
      METRICS_AUTH_TOKEN: ${METRICS_AUTH_TOKEN:?METRICS_AUTH_TOKEN must be set}
      MFA_ENCRYPTION_KEY: ${MFA_ENCRYPTION_KEY:?MFA_ENCRYPTION_KEY must be set}
      AI_PROVIDER: mock
      BILLING_PROVIDER: manual
      RCAA_VERSION: ${RCAA_VERSION:-staging}
      BUILD_ID: ${BUILD_ID:-staging}
      GIT_COMMIT_SHA: ${GIT_COMMIT_SHA:-unknown}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [rcaa-staging]

  frontend:
    image: ${RCAA_FRONTEND_IMAGE:?RCAA_FRONTEND_IMAGE must be set}
    environment:
      NODE_ENV: production
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks: [rcaa-staging]

networks:
  rcaa-staging:
    driver: bridge
