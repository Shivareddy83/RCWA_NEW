name: RCAA Security Scans

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Weekly sweep for newly-disclosed CVEs even with no code changes.
    - cron: "0 6 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  security-events: write

jobs:
  python-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: pip-audit
        run: |
          pip install pip-audit
          pip-audit --strict --progress-spinner=off -r backend/requirements.txt

  node-dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        working-directory: frontend
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: npm audit (high+critical only)
        working-directory: frontend
        run: npm audit --audit-level=high

  codeql:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/autobuild@v3
      - uses: github/codeql-action/analyze@v3

  container-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build backend image (local, not pushed)
        run: docker build -t rcaa-backend:scan ./backend
      - name: Build frontend image (local, not pushed)
        run: docker build -t rcaa-frontend:scan ./frontend
      - name: Trivy scan - backend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rcaa-backend:scan
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true
      - name: Trivy scan - frontend
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: rcaa-frontend:scan
          severity: "CRITICAL,HIGH"
          exit-code: "1"
          ignore-unfixed: true

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Plain open-source Gitleaks CLI, not the gitleaks-action wrapper:
      # gitleaks-action v2 requires a paid GITLEAKS_LICENSE for any repo
      # owned by a GitHub organization. The CLI itself stays MIT-licensed
      # and free no matter who owns the repo.
      - name: Run Gitleaks CLI
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git=false \
            --report-format=sarif --report-path=/repo/gitleaks-report.sarif \
            --exit-code=1 --redact
      - name: Upload SARIF to code scanning
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: gitleaks-report.sarif
