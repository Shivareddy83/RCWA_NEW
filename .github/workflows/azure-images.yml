name: Build Azure Images

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  ACR_LOGIN_SERVER: rcaaacr2026.azurecr.io
  VERSION: "0.15.0"

jobs:
  build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_ACR_USERNAME }}
          password: ${{ secrets.AZURE_ACR_PASSWORD }}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      # ==========================================
      # BACKEND IMAGE
      # ==========================================
      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-backend:${{ env.VERSION }}
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-backend:latest

      # ==========================================
      # WORKER IMAGE
      # Same backend image build context.
      # Azure Container App overrides the command
      # to: python -m app.jobs_worker
      # ==========================================
      - name: Build and push worker
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-worker:${{ env.VERSION }}
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-worker:latest

      # ==========================================
      # FRONTEND IMAGE
      # ==========================================
      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=https://rcaa-backend.yellowbay-bf9ef220.eastasia.azurecontainerapps.io/api/v1
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-frontend:${{ env.VERSION }}
            ${{ env.ACR_LOGIN_SERVER }}/rcaa-frontend:latest